services:
  wordpress:
    user: ${USER_UID}:${USER_GID}
    image: wordpress:php8.5-apache
    ports:
      - "${XO_WORDPRESS_PORT:-8080}:80"
    volumes:
      - ${XO_ROOT_DIR}/${XO_WORDPRESS_ROOT}:/var/www/html/:rw
      - ${XO_ROOT_DIR}/${XO_WORDPRESS_THEME_DIR}:/var/www/html/wp-content/themes/${XO_WORDPRESS_THEME}:rw
      - ${XO_ROOT_DIR}/${XO_WORDPRESS_PLUGINS_DIR}:/var/www/html/wp-content/plugins/:rw
    environment:
      # wp_get_environment_type() defaults to "production" — mark local dev
      # explicitly so environment-aware plugin code (e.g. 2FA enforcement)
      # can relax locally.
      WP_ENVIRONMENT_TYPE: local
      # cron runs in the wpcron sidecar; HTTPS detection behind the proxy.
      # Debug output goes to wp-content/debug.log instead of the page —
      # third-party plugins (e.g. Yoast on PHP 8.5) emit deprecations that
      # would otherwise render into login/frontend markup.
      WORDPRESS_CONFIG_EXTRA: |
        define('DISABLE_WP_CRON', true);
        define('WP_DEBUG_DISPLAY', false);
        define('WP_DEBUG_LOG', true);
        ini_set('display_errors', '0');
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $$_SERVER['HTTPS'] = 'on'; }
    env_file:
      - ${XO_ROOT_DIR}/.env
      - ${XO_ROOT_DIR}/.env.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tty: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  wpcli:
    user: ${USER_UID}:${USER_GID}
    image: wordpress:cli-php8.5
    profiles: ["cli"]
    entrypoint: ["wp"]
    working_dir: /var/www/html
    environment:
      HOME: /tmp
    volumes:
      - ${XO_ROOT_DIR}/${XO_WORDPRESS_ROOT}:/var/www/html/:rw
      - ${XO_ROOT_DIR}/${XO_WORDPRESS_THEME_DIR}:/var/www/html/wp-content/themes/${XO_WORDPRESS_THEME}:rw
      - ${XO_ROOT_DIR}/${XO_WORDPRESS_PLUGINS_DIR}:/var/www/html/wp-content/plugins/:rw
    env_file:
      - ${XO_ROOT_DIR}/.env
      - ${XO_ROOT_DIR}/.env.local
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # external cron (DISABLE_WP_CRON is set): same mechanics as production
  # (ECS service cms-cron), so nothing runs "accidentally" via page hits.
  wpcron:
    user: ${USER_UID}:${USER_GID}
    image: wordpress:cli-php8.5
    entrypoint: ["sh", "-c"]
    command: ["while true; do wp cron event run --due-now --path=/var/www/html 2>/dev/null || true; sleep 60; done"]
    working_dir: /var/www/html
    environment:
      HOME: /tmp
    volumes:
      - ${XO_ROOT_DIR}/${XO_WORDPRESS_ROOT}:/var/www/html/:rw
      - ${XO_ROOT_DIR}/${XO_WORDPRESS_THEME_DIR}:/var/www/html/wp-content/themes/${XO_WORDPRESS_THEME}:rw
      - ${XO_ROOT_DIR}/${XO_WORDPRESS_PLUGINS_DIR}:/var/www/html/wp-content/plugins/:rw
    env_file:
      - ${XO_ROOT_DIR}/.env
      - ${XO_ROOT_DIR}/.env.local
    depends_on:
      - wordpress

networks:
  default:
    external: true
    name: ${XO_PROJECT_NAME}
